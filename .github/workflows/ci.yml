name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a new push to a PR cancels its older run; main runs every push
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: ruff check
        run: |  # only ruff, at the version uv.lock pins; the project is not installed
          ruff=$(uv export --frozen --all-extras --no-hashes --no-emit-project | grep '^ruff==')
          uvx --from "$ruff" ruff check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run --no-sync pytest -q -n auto --durations=20
