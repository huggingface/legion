# A two-agent Harbor run.
name: pi-hf-qwen-team
model: Qwen/Qwen3.8-27B
inference:
  hf_router: {provider: deepinfra}
task:
  repo: https://huggingface.co/datasets/harborframework/terminal-bench-2.1
  dataset: terminal-bench-2.1@2.1.0
  selector: regex-log
  revision: 3e235dff6880252a587fa479c09bcb1e16edf2eb
team_file: ../prompts/team.md
resources:
  message_board:  # a local board; its tools are selected automatically
agents:
  count: 2
environment:
  backend: docker
limits:
  run_timeout_seconds: 600.0
  agent_max_turns: 30
