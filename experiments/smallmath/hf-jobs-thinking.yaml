name: ${RUN_NAME:-smallmath}
model: ${MODEL:-Qwen/Qwen3.8-27B}
naming: consecutive-id
inference:
  hf_jobs:
    flavor: ${FLAVOR:-h200}
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    vllm_args:
      - max_model_len=${MAX_MODEL_LEN:-131072}
    startup_timeout: 30m
  api_key_env: HF_INFERENCE_TOKEN
  max_working: 4
  reasoning_effort: xhigh
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/SmallMath
  selector: ${TASK_ID}
  revision: 57dbf3f7e83aa8c5c980387a2216d7bb87e4e7cc
agents:
  count: 4
team_file: team.md
resources:
  message_board:
    space_id: ${BOARD_SPACE}
    private: false
environment:
  backend: hf-sandbox
workers:
  env:
    LEGION_RESULTS_DIR: ${RESULTS_DIR:-./results}
  agents_per_worker: 4
  turn_timeout: 6m
loop:
  prompt: Continue solving and ensure /app/answer.txt contains your final submission.
  every: turn_end
  while:
    until: 30m
    max_rounds: 100
limits:
  run_timeout_seconds: 2400
  agent_max_turns: 60
