# maze-t01 with N = 4 for the s3-maze positive control (noboard): the scaling sweep's spec with Qwen/Qwen3.5-27B, plus the condition.
name: q27on-maze-t01-n04
model: Qwen/Qwen3.5-27B
naming: consecutive-id
inference:
  urls:
  - http://10.53.0.133:9110/v1
  - http://10.53.0.133:9111/v1
  - http://10.53.0.133:9112/v1
  - http://10.53.0.133:9113/v1
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/s3-maze
  selector: maze-t01
  revision: a43f73c3610cd66bc5e40077901b52eb0fe77314
agents:
  count: 4
stop_on_success: true
success_check:
  service: maze
  command: python3 -I -S /app/success.py
workers:
  agents_per_worker: 4
  turn_timeout: 20m
loop:
  prompt: Continue the task until it is complete, then stop.
  every: turn_end
  while:
    until: 45m
    max_rounds: 6
limits:
  run_timeout_seconds: 3600
  agent_max_turns: 150
namespace: ${NAMESPACE}
bucket: ${BUCKET}
compute:
  kind: slurm
  partition: ${SLURM_PARTITION:-}
  cpus: 7
  mem: 13300M
  time: '2:00:00'
environment:
  backend: podman
