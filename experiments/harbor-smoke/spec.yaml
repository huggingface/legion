# Smoke run of flock's Harbor path on Slurm + rootless podman: 2 agents on terminal-bench's
# regex-log (public), a managed board with rules (its rule proxy is mounted into podman), a short
# loop, and a Trial rollover every ~9 min (trial_hours). One worker holds both agents, so they
# share its managed board. `flock init` writes every ${VAR} below into run.env.
name: ${RUN_NAME:-hsmoke-1}
namespace: HuggingFaceSwarms
bucket: ${BUCKET:-hf://buckets/HuggingFaceSwarms/v8h-test}
compute: {kind: slurm, partition: '${SLURM_PARTITION:-}', cpus: 4, mem: 7G, time: '2:00:00'}
model: huggingface/Qwen/Qwen3.8-27B:deepinfra
# [input, output, cached] USD per 1M tokens (docs/open-models.md; input/output matched the
# router's /v1/models on 2026-11-06): re-read it before a run, Harbor reports no cost for router models
pricing: [0.2, 2.5, 0.2]
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_INFERENCE_TOKEN             # inference only: never the workers' HF_TOKEN
  api_format: openai_chat_completions
task:
  repo: https://huggingface.co/datasets/harborframework/terminal-bench-2.1
  dataset: terminal-bench-2.1@2.1.0
  selector: regex-log
  revision: 3e235dff6880252a587fa479c09bcb1e16edf2eb
team_file: team.md
resources_dir: resources                       # links to flock's built-in ones; `flock init` copies them
resources:
  message_board: {channels: [general], rules: {max_len: 1200, min_post_gap: 10s}}
tools_dir: tools                               # links to flock's built-in ones, as resources
tools: [message_board.*]
agents: {count: 2}
environment: {backend: podman}
workers: {agents_per_worker: 2, turn_timeout: 15m}
loop:
  prompt: Continue the task, then post one line on #general about what you did.
  every: turn_end
  while: {until: 40m, max_rounds: 10}
limits: {run_timeout_seconds: 3000, agent_max_turns: 30, budget_usd: 5, trial_hours: 0.15}  # rollover ~9 min
