# chatbot-v2, self-hosted / max utilization: every knob of the variant in one place. render.py
# turns this, the templates and the parent experiment into a full experiment folder (README.md).
# Endpoint and model ids come from the environment at render time (never written here):
#   SELFHOSTED_BASE_URL       the OpenAI-compatible endpoint (vLLM / sglang), ending in /v1
#   BASE_URL_DS, BASE_URL_GLM per-model endpoints, when the two models are served apart
#   SELFHOSTED_API_KEY        the key's VALUE stays in the env; the spec names the variable
#   MODEL_DS                  the main model id as served (e.g. the --served-model-name)
#   MODEL_GLM                 the second model id; unset: every agent runs MODEL_DS
#   MODEL_INTERVIEWER_STRONG  default MODEL_DS;  MODEL_INTERVIEWER_MID  default MODEL_GLM, else MODEL_DS
# Unset variables render as placeholders (the variable's name), so the spec loads but the
# preflight fails until they are set.
teams: 4                      # teams in phase 1 (a, b, c, ...; at most 26)
per_team: {ds: 2, glm: 2}     # agents per team by model (all ds when MODEL_GLM is unset)
agents_per_worker: 8          # workers per type = ceil(replicas / agents_per_worker)
max_working: null             # null: worker-side turn_end loops (no idle gap); a number: the
                              # controller admits at most this many agents in a turn per provider
api_key_env: SELFHOSTED_API_KEY
timeout_s: 300                # per model call
hours: 4                      # loop duration (while.until); the switch is at the halfway mark
max_rounds: 600               # per agent (continuous mode: ~100 turns/h/agent x 4 h + headroom)
max_turns: 12                 # model calls per prompt (unchanged from the main spec)
wake: {min_gap: 10s, max: 20, window: 30m}
min_post_gap: 10s
models:                       # per-model request extras (chat template switches differ per server)
  ds: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {thinking: false}}
  glm: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {enable_thinking: false}}
  interviewer: {max_tokens: 2048, temperature: 0.7}
world:                        # merged over ../world.yaml (interview quotas stay per team, so the
  probes: {per_agent_per_hour: 8, max_total: 320}   # total scales with the team count)
