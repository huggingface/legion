# v8 (README): six lanes we define, one agent type each, ramped by the controller
# (replicas_ramp), on the chatbot4 world with the v8 seed. The one spec of the run: `flock init`
# writes every ${VAR} below into run.env; partition and worker size come from the cluster profile.
swarm: v8
namespace: HuggingFaceSwarms
bucket: hf://buckets/HuggingFaceSwarms/chatbot-agent-workspaces  # checkpoint: <bucket>/controller/<run dir name>
compute:
  kind: slurm
  partition: ${SLURM_PARTITION:-}
  cpus: ${WORKER_CPUS:-4}
  mem: ${WORKER_MEM:-7G}
  time: '54:00:00'                          # worker_lifetime 54h
naming: words
providers:
  vllm:
    type: openai_compat
    base_urls: '${OPENAI_BASE_URLS:-https://your-vllm.example.invalid/v1}'  # comma-separated
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing: {"*": [0, 0, 0]}
models:
  worker-pi: {model: 'vllm:${MODEL_WORKER:-MODEL_WORKER}', reasoning: high}
world:
  dir: ${WORLD_DIR:-../../worlds/chatbot4}
  # The world's v8 settings (README). CHATBOT_BUCKET holds its state (world.tar.gz): an empty
  # CHATBOT_WS is restored from it before serving, and pushed back every 5 min and at exit.
  command: [env, 'CHATBOT_REPO=${CHATBOT_REPO:-HuggingFaceSwarms/SwarmChat-v8}', CHATBOT_SEED_DIR=seed-v8,
            CHATBOT_MAX_REVIEWERS=2, CHATBOT_PR_OPEN_BUDGET_SCOPE=new_modules,
            'CHATBOT_BUCKET=${CHATBOT_BUCKET}', '{python}', chatbot4.py, serve]
  url: http://${WORLD_HOST}:7860            # the world job's host:port (hosts/world.host)
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  extended: true
  url: ${CHATBOT_BOARD_URL:-https://huggingfaceswarms-chatbot-v8-msgboard.hf.space}
  invite_env: CHATBOT_BOARD_INVITE
  channel: ${CHATBOT_CHANNEL:-general}
  wake: [mention, thread, channel]          # no DMs: everything is public (README)
  rules:
    min_post_gap: 10s
    max_len: 1200                           # short posts (v4-v7 posts were ~1,500 chars)
    threads: per_topic
    no_group_mentions: true                 # agents' @all woke nobody and buried the channel
    max_channels_per_agent: 3               # the lane channel, a team channel, one more
    max_channels: 40                        # general, 6 lanes, ~30 team channels (v5/v6 sprawled to 70-100)
  protocols: []
types:
  answers: &lane
    harness: pi
    model: worker-pi
    replicas: 0                             # replicas_ramp raises it
    replicas_ramp: {start: 12, add: 12, every: 10m, max: 96}
    agents_per_worker: 12
    system_prompt_file: prompts/system.md
    system_prompt_append_file: prompts/lanes/answers.md
    comms: true
    tools: ['world:run_bot', 'world:open_pr', 'world:review_pr', 'world:merge_pr', 'world:list_prs', 'world:close_pr', 'world:get_pr',
            # the board tools, listed so that comms:dm and comms:read_dms are left out
            'comms:post', 'comms:read', 'comms:search', 'comms:channels', 'comms:create_channel',
            'comms:join_channel', 'comms:react', 'comms:doc', 'comms:edit_doc']
    persist_workdir: true
    secrets: [OPENAI_API_KEY]
    env:                                    # git memory caps for agent clones (git -c via env)
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: pack.windowMemory
      GIT_CONFIG_VALUE_0: 256m
      GIT_CONFIG_KEY_1: pack.threads
      GIT_CONFIG_VALUE_1: '1'
      GIT_CONFIG_KEY_2: gc.auto
      GIT_CONFIG_VALUE_2: '0'
    max_turns: 150
    turn_timeout: 2h
    worker_lifetime: 54h
    lifetime_jitter: 0s
    resume_prompt: 'Your previous turn was interrupted. Read your notes, check your clone and PRs, and continue.'
    loop:
      prompt_file: prompts/round.md
      every: turn_end
      notices: true
      on: [comms.mention, comms.thread, comms.channel]
      while: {until: 48h, max_rounds: 10000}
      final: {prompt_file: prompts/final.md}
  understanding:
    <<: *lane
    replicas_ramp: {start: 6, add: 6, every: 10m, max: 24}
    system_prompt_append_file: prompts/lanes/understanding.md
  conversation:
    <<: *lane
    replicas_ramp: {start: 6, add: 6, every: 10m, max: 48}
    system_prompt_append_file: prompts/lanes/conversation.md
  routing:
    <<: *lane
    replicas_ramp: {start: 6, add: 6, every: 20m, max: 24}
    system_prompt_append_file: prompts/lanes/routing.md
  quality:
    <<: *lane
    replicas_ramp: {start: 6, add: 6, every: 15m, max: 36}
    system_prompt_append_file: prompts/lanes/quality.md
  safety:
    <<: *lane
    replicas_ramp: {start: 3, add: 3, every: 30m, max: 6}
    system_prompt_append_file: prompts/lanes/safety.md
# No spawn block: agents cannot start others. 39 agents at the start, 234 after 75 minutes.
limits: {alive: 250}
