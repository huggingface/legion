# v8 (experiments/v8 on v8-port: six lanes, its prompts) on flock's Harbor path, on HF Jobs: one
# agent per lane, each a dedicated hf-sandbox Trial of the task chatbot4-v8-agent, started by its
# own worker job. The shared chatbot4 world and a dedicated board are resources, reached over
# HTTP through the world.* and board.* tools. `flock init` writes every ${VAR} below into run.env.
# Differences from v8: prompts/system.md names $CHATBOT_REPO and shepherd's tool calls, and
# arrives in the first prompt (not as a system prompt); one agent per lane, no ramps; the board's
# rules are not enforced on hf-sandbox (no mounts, no rule proxy: run.json warns).
name: ${RUN_NAME:-v8h-1}
namespace: HuggingFaceSwarms                   # bills the workers and the sandboxes (kwargs)
bucket: hf://buckets/HuggingFaceSwarms/v8h-test
compute: hf-jobs
harness: pi
model: huggingface/deepseek-ai/DeepSeek-V4.1-Flash-1017:novita   # v8's model
# [input, output, cached] USD per 1M tokens (router novita, input/output as on 2026-11-06):
# re-read the router's /v1/models before a run, Harbor reports no cost for router models
pricing: [0.30, 1.20, 0.30]
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_INFERENCE_TOKEN             # inference only: never the workers' HF_TOKEN or one that can write CHATBOT_REPO
  api_format: openai_chat_completions
  reasoning_effort: high
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/swarmchat-harbor   # tasks/chatbot4-v8-agent
  selector: chatbot4-v8-agent
  revision: '${TASK_REV}'                     # the published commit SHA
team_file: prompts/system.md
resources_dir: resources                       # links to flock's plugins; `flock init` copies them
resources:
  board:
    url: '${BOARD_URL}'                       # a dedicated, public board Space (sandboxes hold no HF token)
    token_env: MSGBOARD_OPERATOR_TOKEN        # its operator token (the worker's, never an agent's)
    # listed so the poller watches them: a mention in a channel not listed wakes no one
    channels: [general, understanding, answers, conversation, routing, quality, safety]
    wake: [mention, thread, channel]          # v8's: no DMs
    rules:                                    # v8's comms rules; not enforced on hf-sandbox
      min_post_gap: 10s
      max_len: 1200
      threads: per_topic
      no_group_mentions: true
      max_channels_per_agent: 3
      max_channels: 40
  world:
    url: '${WORLD_URL}'                       # the world job's --expose-public URL
    token_env: CHATBOT_WORLD_TOKEN            # = the world's FLOCK_WORLD_TOKEN; one world per run,
                                              # a new secret each run (same secret + name = same agent)
    transport: http                           # no mounts on hf-sandbox: each agent's own token
tools_dir: tools                               # links to flock's plugins, as resources
tools:
  - board.*
  - board_extra.*                             # react, doc, edit_doc: v8's board tools beyond shepherd's
  - world.*
agents:
  roles:
    understanding: {role_file: prompts/lanes/understanding.md}
    answers: {role_file: prompts/lanes/answers.md}
    conversation: {role_file: prompts/lanes/conversation.md}
    routing: {role_file: prompts/lanes/routing.md}
    quality: {role_file: prompts/lanes/quality.md}
    safety: {role_file: prompts/lanes/safety.md}
environment:
  backend: hf-sandbox
  # job_timeout is the sandbox's idle timeout: longer than turn_timeout
  kwargs: {flavor: cpu-basic, namespace: HuggingFaceSwarms, job_timeout: 3h}
workers:
  agents_per_worker: 1
  flavor: cpu-basic
  turn_timeout: 2h                            # v8's
  worker_lifetime: 8h
  env: {CHATBOT_REPO: '${CHATBOT_REPO}'}      # the task's [environment.env] reads it from the worker
loop:                                         # v8's, for 3 h
  prompt_file: prompts/round.md
  every: turn_end
  notices: true
  on: [board.mention, board.thread, board.channel]
  while: {until: 3h, max_rounds: 10000}
  final: {prompt_file: prompts/final.md, reserve_usd: 3}
  resume_prompt: 'Your previous turn was interrupted. Read your notes, check your clone and PRs, and continue.'
limits:
  run_timeout_seconds: 11400                  # 3 h plus 10 min
  agent_max_turns: 150                        # v8's max_turns (per round there)
  budget_usd: 60
  trial_hours: 20                             # plus turn_timeout must stay under hf-sandbox's 24 h
output_dir: out
