name: ${RUN_NAME}
namespace: edbeeching
bucket: ${RUN_BUCKET}
compute: {kind: slurm, partition: hopper-cpu, cpus: 24, mem: 44G, time: '5:00:00'}
model: openai/Qwen/Qwen3.8-27B
inference:
  base_url: ${ROUTER_URL}
  api_key_env: ROUTER_API_KEY
  reasoning_effort: low
  max_working: 16
naming: consecutive-id
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/programbench-harbor-staging
  revision: 71a3477240b19b966da44873be69e15364e50481
  selector: wfxr--csview.8ac4de0
team_file: team.md
resources_dir: resources
resources:
  hf_repo: {repo_id: '${HF_REPO_ID}', token_env: HF_TOKEN}
  programbench_runtime: {}
  message_board: {url: '${BOARD_URL}', token_env: BOARD_TOKEN}
tools: [message_board.*, hf_repo.*]
agents: {count: 16}
environment: {backend: podman}
workers:
  agents_per_worker: 2
  max_working_per_worker: 2
  turn_timeout: 20m
  worker_lifetime: 5h
  lifetime_jitter: 0s
  drain_window: 130m
loop:
  prompt: Continue the shared task. Check your claimed work, current main and the board. Implement, test or review useful original changes. Keep a buildable submission in your task workspace.
  every: turn_end
  while: {until: 100m}
  final:
    prompt: Final submission phase. Coordinator freeze and announce the candidate SHA now. Everyone synchronize that SHA, copy original source into the task workspace, run a clean build, commit the task submission and report SHA and build result. Do not start new features. Finish within20 minutes.
limits:
  run_timeout_seconds: 18000
  agent_max_turns: 60
  trial_hours: 4
