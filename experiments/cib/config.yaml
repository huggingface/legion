name: ci-gemini
harness: pi
model: openai/gemini-3.8-flash
inference:
  base_url: http://model-compat:8003/v1
  api_key_env: GEMINI_API_KEY
  api_format: openai_chat_completions
  reasoning_effort: low
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/collaborative-intelligence-benchmark
  revision: 2404577cc0b03402a86b7195ac62500664f3a75e
  selector: ci-sharing-h2-r-choosing-the-safe-field-station-solo-s0
agents:
  count: 1
environment:
  backend: podman
limits:
  run_timeout_seconds: 3600
  agent_max_turns: 256
  agent_timeout_seconds: null
