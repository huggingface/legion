name: ${RUN_NAME}
namespace: ${HF_NAMESPACE}
bucket: ${RUN_BUCKET}
compute:
  kind: slurm
  partition: hopper-cpu
  cpus: 12
  mem: 22800M
  time: '5:00:00'
model: huggingface/Qwen/Qwen3.8-27B:deepinfra
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_INFERENCE_TOKEN
  reasoning_effort: low
  max_working: 16
naming: consecutive-id
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/programbench-harbor-staging
  revision: 71a3477240b19b966da44873be69e15364e50481
  selector: wfxr--csview.8ac4de0
team_file: team.md
resources_dir: resources
resources:
  hf_repo:
    repo_id: ${HF_REPO_ID}
    token_env: HF_TOKEN
  programbench_runtime: {}
  message_board:
    url: ${BOARD_URL}
    token_env: BOARD_TOKEN
tools:
- message_board.*
- hf_repo.*
agents:
  count: 16
environment:
  backend: podman
workers:
  agents_per_worker: 2
  max_working_per_worker: 2
  turn_timeout: 5m
  worker_lifetime: 5h
  lifetime_jitter: 0s
  drain_window: 130m
  env:
    HEARTBEAT_INTERVAL: '5'
loop:
  prompt: 'Do ONE checkpoint and end the turn. FIRST inspect whether /workspace/compile.sh
    and original source are committed and buildable. If NOT: STOP REFERENCE PROBING
    NOW. Your next work must be writing or adopting the smallest original implementation
    plus executable compile.sh, clean-building and committing it. Prefer Python3 standard
    library for this initial checkpoint; incomplete behavior is acceptable. Do not
    run the reference again until this build checkpoint exists. The preserved reference
    is /tmp/reference/executable; never overwrite or submit it. If your submission
    ALREADY builds: fix one mismatch using at most two probes of that preserved reference,
    or review/adopt one tested peer change. Publish a small PR or board milestone
    with commit SHA and build result, then RETURN. Do not keep exploring or wait on
    a failing merge.'
  every: turn_end
  while:
    until: 100m
  final:
    prompt: 'Final submission: use your best locally validated ORIGINAL candidate,
      shared or local. Stop probing and adding features. Ensure original source and
      executable compile.sh are committed in the task workspace and pass a source-only
      clean build. Never copy the preserved reference into the solution. Run the task
      completion command and return. Do not wait for merges or another agent.'
limits:
  run_timeout_seconds: 18000
  agent_max_turns: 8
  trial_hours: 4
