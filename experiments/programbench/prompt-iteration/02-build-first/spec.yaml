name: ${RUN_NAME}
namespace: ${HF_NAMESPACE}
bucket: ${RUN_BUCKET}
compute:
  kind: slurm
  partition: hopper-cpu
  cpus: 12
  mem: 22800M
  time: '5:00:00'
model: huggingface/Qwen/Qwen3.8-27B:deepinfra
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_INFERENCE_TOKEN
  reasoning_effort: low
  max_working: 16
naming: consecutive-id
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/programbench-harbor-staging
  revision: 71a3477240b19b966da44873be69e15364e50481
  selector: wfxr--csview.8ac4de0
team_file: team.md
resources_dir: resources
resources:
  hf_repo:
    repo_id: ${HF_REPO_ID}
    token_env: HF_TOKEN
  programbench_runtime: {}
  message_board:
    url: ${BOARD_URL}
    token_env: BOARD_TOKEN
tools:
- message_board.*
- hf_repo.*
agents:
  count: 16
environment:
  backend: podman
workers:
  agents_per_worker: 2
  max_working_per_worker: 2
  turn_timeout: 20m
  worker_lifetime: 5h
  lifetime_jitter: 0s
  drain_window: 130m
  env:
    HEARTBEAT_INTERVAL: '5'
loop:
  prompt: Deliver a buildable original submission first. Read the task and team instructions,
    create or adopt the smallest working source and compile.sh, test a source-only
    clean build, and commit it. Then improve one concrete mismatch at a time and collaborate
    through small tested PRs. Do not spend the turn only exploring. End this turn
    after one tested, committed checkpoint (aim for under three minutes); the next
    turn will continue the work.
  every: turn_end
  while:
    until: 100m
  final:
    prompt: 'Final submission phase: stop probing and adding features now. Use the
      latest buildable shared candidate if available; otherwise use your last working
      local version. Put original source and executable compile.sh in the task workspace,
      test a source-only clean build, commit the task submission, and run the task
      completion command. Report the submission SHA and build result. Do not wait
      for another agent. Finish within five minutes.'
limits:
  run_timeout_seconds: 18000
  agent_max_turns: 60
  trial_hours: 4
