# Generated by render.py; edit spec.yaml and render again.
swarm: run4
compute:
  kind: slurm
  partition: hopper-cpu
  cpus: 4
  mem: 7G
  time: '54:00:00'
naming: words
providers:
  vllm:
    type: openai_compat
    base_url: https://your-vllm.example.invalid/v1
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing:
      '*':
      - 0
      - 0
      - 0
models:
  worker-pi:
    model: vllm:MODEL_WORKER
    reasoning: high
world:
  url: http://${WORLD_HOST}:7860
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  extended: true
  url: https://cmpatino-msgboard-chatbot.hf.space
  invite_env: CHATBOT_BOARD_INVITE
  channel: general
  wake:
  - mention
  - thread
  - dm
  - channel
  rules:
    min_post_gap: 10s
    max_len: 2000
    threads: per_topic
    no_group_mentions: false
    max_channels_per_agent: 3
    max_channels: 60
  protocols: []
types:
  agent:
    harness: pi
    model: worker-pi
    replicas: 0
    agents_per_worker: 12
    system_prompt_file: prompts/system.md
    comms: true
    tools:
    - world:run_bot
    - world:open_pr
    - world:review_pr
    - world:merge_pr
    - world:list_prs
    - world:close_pr
    persist_workdir: true
    secrets:
    - OPENAI_API_KEY
    env:
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: pack.windowMemory
      GIT_CONFIG_VALUE_0: 256m
      GIT_CONFIG_KEY_1: pack.threads
      GIT_CONFIG_VALUE_1: '1'
      GIT_CONFIG_KEY_2: gc.auto
      GIT_CONFIG_VALUE_2: '0'
