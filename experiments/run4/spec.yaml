swarm: ${CHATBOT_RUN:-run4}             # ${VAR:-default}: flock apply --env run.env (README)
compute: local
naming: words
providers:
  vllm:
    type: openai_compat
    base_url: ${OPENAI_BASE_URL:-https://your-vllm.example.invalid/v1}
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing: {"*": [0, 0, 0]}
models:
  worker-pi: {model: 'vllm:${MODEL_WORKER:-MODEL_WORKER}', reasoning: high}
world:
  dir: ../../worlds/chatbot4
  command: ['{python}', chatbot4.py, serve]
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  extended: true
  url: ${CHATBOT_BOARD_URL:-https://cmpatino-msgboard-chatbot.hf.space}
  invite_env: CHATBOT_BOARD_INVITE
  channel: ${CHATBOT_CHANNEL:-general}
  wake: [mention, thread, dm, channel]
  rules:
    min_post_gap: 10s
    max_len: 2000
    threads: per_topic
    no_group_mentions: false
    max_channels_per_agent: 3
    max_channels: 60
  protocols: []
types:
  agent: &agent
    harness: pi
    model: worker-pi
    replicas: 0
    agents_per_worker: 12
    system_prompt_file: prompts/system.md
    comms: true
    tools: ['world:run_bot', 'world:open_pr', 'world:review_pr', 'world:merge_pr', 'world:list_prs', 'world:close_pr', 'world:get_pr']
    persist_workdir: true
    secrets: [OPENAI_API_KEY]
    env:                                    # git memory caps for agent clones (git -c via env)
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: pack.windowMemory
      GIT_CONFIG_VALUE_0: 256m
      GIT_CONFIG_KEY_1: pack.threads
      GIT_CONFIG_VALUE_1: '1'
      GIT_CONFIG_KEY_2: gc.auto
      GIT_CONFIG_VALUE_2: '0'
    max_turns: 150
    turn_timeout: 2h
    worker_lifetime: 54h
    lifetime_jitter: 0s
    resume_prompt: 'Your previous turn was interrupted. Read your notes, check your clone and PRs, and continue.'
    loop:
      prompt_file: prompts/round.md
      every: turn_end
      notices: true
      on: [comms.mention, comms.thread, comms.dm, comms.channel]
      while: {until: 48h, max_rounds: 10000}
      final: {prompt_file: prompts/final.md}
  # The spawner wave (README "Spawner wave"): the same agent, plus a group section. Waves add
  # agent-spawner replicas; each may spawn up to 4 agent-child peers (spawn: below).
  agent-spawner:
    <<: *agent
    replicas: 0
    system_prompt_append_file: prompts/group-spawner.md
    workers: {initial: 2, max_extra: 0}     # 20 spawners at 12 per worker
  agent-child:
    <<: *agent
    replicas: 0
    system_prompt_append_file: prompts/group-child.md
    workers: {initial: 0, max_extra: 7}     # 80 children at 12 per worker, opened on demand
spawn:
  agent-spawner: {types: {agent-child: 4}, depth: 1}
limits: {alive: 400, spawned_total: 100}
