type: agent
think_share: 0
cap: 300
stagger_s: 10
waves:
  - {at: 0, add: 20}
  - {at: 5m, add: 20}
  - {at: 10m, add: 20}
  - {at: 15m, add: 20}
  - {at: 20m, add: 20}
  - {every: 10m, add: 20, until: 300}
# `waves.py add 20 --type agent-spawner` (README "Spawner wave"): its own cap, outside `cap`.
type_caps: {agent-spawner: 20}
