name: ${RUN_NAME:-imo-answerbench-solo}
model: ${MODEL:-Qwen/Qwen3.8-27B}
naming: consecutive-id
inference:
  hf_jobs:
    flavor: ${FLAVOR:-h200}
    tool_call_parser: qwen3_coder
    vllm_args:
      - max_model_len=${MAX_MODEL_LEN:-131072}
      - 'default_chat_template_kwargs={"enable_thinking": false}'
    startup_timeout: 30m
  api_key_env: HF_INFERENCE_TOKEN
  max_working: 1
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/IMO-AnswerBench
  selector: ${TASK_ID}
  revision: 40d9d407c8b5e4b62c6b2047e21c807214f2a068
agents:
  count: 1
environment:
  backend: hf-sandbox
workers:
  env:
    LEGION_RESULTS_DIR: ${RESULTS_DIR:-./results}
  agents_per_worker: 1
  turn_timeout: 30m
limits:
  run_timeout_seconds: 2400
  agent_max_turns: 60
