name: ${RUN_NAME:-imo-answerbench}
model: ${MODEL:-Qwen/Qwen3.8-27B}
naming: consecutive-id
inference:
  urls:
    - ${SERVER_URL}
  api_key_env: HF_INFERENCE_TOKEN
  # For Qwen3.8 thinking use xhigh (not high); its template accepts xhigh, medium, low.
  reasoning_effort: ${REASONING_EFFORT:-off}
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/IMO-AnswerBench
  selector: ${TASK_ID}
  revision: 40d9d407c8b5e4b62c6b2047e21c807214f2a068
agents:
  count: 4
team_file: team.md
resources:
  message_board:
    wake: ["mention", "thread", "channel"]
    space_id: ${BOARD_SPACE}
    private: false
tools: [message_board.post, message_board.read, message_board.wait]
environment:
  backend: ${ENV_BACKEND:-hf-sandbox}
workers:
  env:
    LEGION_RESULTS_DIR: ${RESULTS_DIR:-./results}
  agents_per_worker: 4
  turn_timeout: 6m
loop:
  prompt: Continue solving and ensure /app/answer.txt contains your final submission.
  every: 24h
  notices: true
  on: ["message_board.channel", "message_board.mention", "message_board.thread"]
  wake:
    min_gap: 20s
    max: null
  while:
    until: 30m
    max_rounds: 100
  final:
    prompt: "The run is ending. Make sure /app/answer.txt holds just your final answer, then stop."
limits:
  run_timeout_seconds: 2400
  agent_max_turns: 60
