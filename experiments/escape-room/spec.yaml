# Four agents solve one AgentEscapeBench room (difficulty 20) in local Docker, sharing a board.
# What it needs, cost and how to launch: README.md.
name: ${RUN_NAME:-escape-room-1}
model: Qwen/Qwen3.8-27B
inference:
  hf_router:
    provider: deepinfra
  reasoning_effort: low
task:
  repo: https://huggingface.co/datasets/HuggingFaceSwarms/AgentEscapeBench
  selector: agentescape-20-skeleton-0052d9e8
  revision: eeccfb09a986db1670b56673b22ebea4d473d2a8
team_file: prompts/team.md
resources:
  message_board:  # a local board; its tools are selected automatically
agents:
  count: 4
environment:
  backend: docker
workers:  # one worker: a local board is per worker
  agents_per_worker: 4
loop:  # one start prompt per agent
  prompt: Work on the task.
  while:
    max_rounds: 1
limits:
  run_timeout_seconds: 3600
  agent_max_turns: 200
