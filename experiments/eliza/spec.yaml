# Eliza on flock: 5 open-model agents write the best ELIZA-style chatbot together.
# The task lives in the world (worlds/eliza: workspace, run_bot, promote_best); the loop, the
# board and the budget are this spec. No loop code anywhere. How to run: README.md.
swarm: eliza
compute: local
providers:
  hf:
    type: openai_compat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    timeout_s: 180
    max_retries: 5
    pricing:                                   # USD per 1M tokens: input, output, cached
      "deepseek-ai/DeepSeek-V4.1-Flash-1017:novita": [0.30, 1.20, 0.30]
      "zai-org/GLM-5.3-Flash:novita": [0.15, 0.50, 0.15]
models:                                        # swap in any router model with tool calls
  deepseek:
    model: "hf:deepseek-ai/DeepSeek-V4.1-Flash-1017:novita"
    extra: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {thinking: false}}
  glm:
    model: "hf:zai-org/GLM-5.3-Flash:novita"
    extra: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {enable_thinking: false}}
world:
  dir: ../../worlds/eliza                      # workspace: worlds/eliza/ws (or $ELIZA_WS)
  command: ["{python}", -m, flock.world, serve, "eliza:ElizaWorld"]
comms:
  kind: msgboard
  url: https://msgboard.example.invalid        # placeholder: your board's URL
  invite_env: ELIZA_BOARD_INVITE               # a multi-use agent invite for the channel
  channel: your-eliza-channel                  # placeholder: the channel's name
  kickoff_file: prompts/kickoff.md
  rules: {min_post_gap: 20s, max_posts: 60, max_len: 800, threads: per_topic, no_group_mentions: true}
  protocols: [protocols/lead-agree.md, protocols/eliza.md]
types:
  ds: &dev
    harness: llm
    model: deepseek
    replicas: 3
    agents_per_worker: 5
    system_prompt_file: prompts/system.md
    comms: true                                # post, read, search; every world tool
    bash: false                                # world and board tools only
    tool_choice: required                      # every model call is a tool call; `done` ends a turn
    max_turns: 12                              # model calls per prompt (one edit per call)
    max_budget_usd: 0.20                       # per prompt
    tool_output_chars: 32000                   # read_file of a whole bot (default 8000 cuts it)
    context_tokens: 64000                      # compaction threshold (default 32000)
    loop:
      prompt_file: prompts/round.md
      every: 90s
      on: [comms.mention, comms.thread]       # board wake-ups (2 s debounce)
      wake: {min_gap: 30s, max: 10}            # the defaults: a wake is not a round
      while: {until: 2h, max_rounds: 80, agent_usd: {deepseek: 3.60, glm: 2.10}}
      final: {prompt_file: prompts/final.md, reserve_usd: 0.30}
  glm:
    <<: *dev
    model: glm
    replicas: 2
limits:
  budget_usd: 15                               # hard stop; loops stop at 15 - 2 x 0.30 = 14.40
