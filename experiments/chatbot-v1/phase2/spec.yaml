# chatbot-v1, phase 2 (merged): the same swarm, the same 8 agents, the phase-2 prompts. Apply it
# to the running swarm with `flock update phase2/spec.local.yaml` right AFTER the world's merge
# switch (`chatbot.py merge`; README.md "Phase switch"). Only the prompt and protocol files differ
# from ../spec.yaml (tests/test_chatbot_experiment.py checks that); paths are relative to phase2/.
swarm: chatbot-v1
compute: local
tools_dir: ../tools                             # spawn_interviewer (tools/interview.py)
providers:
  hf:
    type: openai_compat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    timeout_s: 180
    max_retries: 5
    pricing:                                   # USD per 1M tokens: input, output, cached
      "deepseek-ai/DeepSeek-V4.1-Flash-1017:novita": [0.30, 1.20, 0.30]
      "zai-org/GLM-5.3-Flash:novita": [0.15, 0.50, 0.15]
      "Qwen/Qwen3.5-9B:deepinfra": [0.10, 0.15, 0.10]  # router /v1/models, 2026-10-22
models:
  deepseek:
    model: "hf:deepseek-ai/DeepSeek-V4.1-Flash-1017:novita"
    extra: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {thinking: false}}
  glm:
    model: "hf:zai-org/GLM-5.3-Flash:novita"
    extra: {max_tokens: 32000, temperature: 0.6, chat_template_kwargs: {enable_thinking: false}}
  qwen9b:                                      # interviewer-mid
    model: "hf:Qwen/Qwen3.5-9B:deepinfra"        # pinned: priced, tool calls
    extra: {max_tokens: 1024, temperature: 0.7, chat_template_kwargs: {enable_thinking: false}}
world:
  dir: ../../../worlds/chatbot                  # workspace: $CHATBOT_WS (default worlds/chatbot/ws)
  command: ["{python}", chatbot.py, serve]     # World API v1 + the operator's /operator/phase
  token_env: CHATBOT_WORLD_TOKEN               # the operator's `chatbot.py merge` needs it too
comms:
  kind: msgboard
  url: https://msgboard.example.invalid        # placeholder: your board's URL
  invite_env: CHATBOT_BOARD_INVITE             # a multi-use agent invite for the channel
  channel: your-chatbot-channel                # placeholder: the channel's name
  kickoff_file: ../prompts/kickoff.md   # posted once, in phase 1
  rules: {min_post_gap: 10s, max_posts: 80, max_len: 800, threads: per_topic, no_group_mentions: true}
  protocols: [../protocols/chatbot.md, protocol.md]
types:
  ds-a: &team-a
    harness: llm
    model: deepseek
    replicas: 2
    agents_per_worker: 4
    system_prompt_file: system.md          # both teams
    comms: true                                # post, read, search
    tools: [spawn_interviewer, "world:read_file", "world:write_file", "world:copy_file",
            "world:edit_file", "world:insert_after", "world:list_files", "world:run_bot",
            "world:promote_best", "world:best_status", "world:qualify", "world:verdicts"]
    bash: false                                # world, board and spawn tools only
    tool_choice: required                      # every model call is a tool call; `done` ends a turn
    max_turns: 12                              # model calls per prompt (one edit per call)
    max_budget_usd: 0.20                       # per prompt
    tool_output_chars: 32000                   # read_file of a whole bot
    context_tokens: 64000                      # compaction threshold
    loop: &loop-a
      first: |
        Start (round 0). One tool call per reply:
        1. Call `read` (no arguments) to see the kickoff.
        2. If you are ds-a-0000: call `post` with thread "new" and this text, then go to step 3:
           "[team-a] Team A thread (ds-a-0000, ds-a-0001, glm-a-0000, glm-a-0001). No lead: first agree on our own direction here ([direction?] proposals), then a [split]; answer with agree <id>."
           Everyone else: do not post now.
        3. Call `done` with summary "started".
      prompt_file: round.md
      every: 90s
      stagger: 4s
      on: [comms.mention, comms.thread]        # board wake-ups (2 s debounce)
      wake: {min_gap: 30s, max: 10}            # the defaults: a wake is not a round
      # PLACEHOLDER caps, per agent by model alias: set them before the run
      while: {until: 4h, max_rounds: 200, agent_usd: 16.00}   # per agent, every team type
      final: {prompt_file: final.md, reserve_usd: 0.30}
  glm-a:
    <<: *team-a
    model: glm
  ds-b: &team-b
    <<: *team-a
    loop:
      <<: *loop-a
      first: |
        Start (round 0). One tool call per reply:
        1. Call `read` (no arguments) to see the kickoff.
        2. If you are ds-b-0000: call `post` with thread "new" and this text, then go to step 3:
           "[team-b] Team B thread (ds-b-0000, ds-b-0001, glm-b-0000, glm-b-0001). No lead: first agree on our own direction here ([direction?] proposals), then a [split]; answer with agree <id>."
           Everyone else: do not post now.
        3. Call `done` with summary "started".
  glm-b:
    <<: *team-b
    model: glm
  # Interviewers: spawned by team agents (spawn_interviewer), never replicas, no loop. One prompt
  # is the whole life of one: chat with a qualified candidate, submit_verdict, post, done.
  interviewer-mid: &interviewer
    harness: llm
    model: qwen9b
    replicas: 0
    agents_per_worker: 8
    workers: {initial: 0, max_extra: 2}        # 16 live at most (8 team agents x 2)
    ephemeral: true                            # removed once its session ends (docs/spawn.md)
    system_prompt_file: ../prompts/interviewer.md
    tools: ["world:chat", "world:submit_verdict", "comms:post"]
    bash: false
    tool_choice: required
    max_turns: 12                              # 7-8 chat messages + verdict + post + done (+ a nudge)
    max_budget_usd: 0.15                       # PLACEHOLDER per interviewer (its one prompt)
    tool_output_chars: 4000
  interviewer-strong:
    <<: *interviewer
    model: deepseek                            # DeepSeek-V4.1-Flash; `glm` for GLM-5.3-Flash
spawn:                                         # live interviewers per team agent: max
  ds-a: &interviews {types: [interviewer-mid, interviewer-strong], max: 2, depth: 1}
  glm-a: *interviews
  ds-b: *interviews
  glm-b: *interviews
limits:
  budget_usd: 150                              # hard stop; loops stop at 150 - 4 x 0.30 = 148.80
  spawned_total: 64                            # interviewers ever spawned in the run
