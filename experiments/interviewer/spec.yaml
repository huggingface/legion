# Interviewer (README): hierarchy (coordinators spawn up to 4 workers) plus ephemeral
# interviewers that coordinators and workers spawn to judge a bot (main or a PR).
# World, board, model and loop are run 4's (experiments/run4/spec.yaml).
swarm: ${CHATBOT_RUN:-interviewer}             # ${VAR:-default}: flock launch --env run.env (run 4 README)
compute:                                    # ${VAR:-default}: run.env (or the shell) fills them; the spec wins
  kind: ${COMPUTE_KIND:-slurm}              # COMPUTE_KIND=local: `flock launch` on one machine
  partition: ${RUN3_SLURM_PARTITION:-hopper-cpu}
  cpus: ${WORKER_CPUS:-4}                   # hopper-cpu MaxMemPerCPU=2000: at most 2000 MB per CPU
  mem: ${WORKER_MEM:-7G}
  time: '54:00:00'                          # matches worker_lifetime 54h; the run is 48h
  types:                                    # interviewer slots: 2 CPUs / 3800M (one session each)
    interviewer: {cpus: '${RUN3_INTERVIEWER_CPUS:-2}', mem: '${RUN3_INTERVIEWER_MEM:-3800M}'}
bucket: ${RUN3_BUCKET:-hf://buckets/cmpatino/eliza-swarm}
namespace: ${RUN3_NAMESPACE:-cmpatino}
naming: words
providers:
  vllm:
    type: openai_compat
    base_urls: '${OPENAI_BASE_URLS:-https://your-vllm.example.invalid/v1}'  # comma-separated
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing: {"*": [0, 0, 0]}
    metrics: true                           # vLLM /metrics: health and the ramp's hold_if
models:
  worker-pi: {model: 'vllm:${MODEL_WORKER:-MODEL_WORKER}', reasoning: high}
  interviewer:                              # thinking off, as run 3's interviewers
    model: 'vllm:${MODEL_INTERVIEWER:-MODEL_INTERVIEWER}'  # may be the same id as MODEL_WORKER
    extra: {max_tokens: 2048, temperature: 0.7, chat_template_kwargs: {thinking: false}}
world:
  dir: ${WORLD_DIR:-../../worlds/chatbot4}   # flock init writes WORLD_DIR (absolute) for a copied folder
  command: ['{python}', chatbot4.py, serve]
  url: http://${WORLD_HOST}:7860              # Slurm: the world job's host (FLOCK_WORLD_HOST_FILE); local runs `command`
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  extended: true
  url: ${CHATBOT_BOARD_URL:-https://huggingfaceswarms-chatbot-v9-msgboard.hf.space/boards/chatbot-v9}
  invite_env: CHATBOT_BOARD_INVITE
  channel: ${CHATBOT_CHANNEL:-general}
  wake: [mention, thread, dm, channel]
  rules:
    min_post_gap: 10s
    max_len: 2000
    threads: per_topic
    no_group_mentions: false
    max_channels_per_agent: 3
    max_channels: 60
  protocols: []
types:
  coordinator: &agent
    harness: pi
    model: worker-pi
    replicas: 0                             # the ramp raises it; `flock update` keeps the live count
    replicas_ramp:                          # the controller raises replicas (was waves.yaml)
      {start: 10, add: 10, every: 10m, max: 50, stagger: 10s,
       hold_if: {waiting: 1, request_s: '${RUN4_MAX_REQUEST_SECONDS:-15}', above: 100}}  # was load_guard.py
    agents_per_worker: 12
    system_prompt_file: prompts/system.md
    system_prompt_append_file: prompts/coordinator.md
    workers: {initial: 5, max_extra: 0}     # 50 coordinators at 12 per worker
    comms: true
    tools: ['world:run_bot', 'world:open_pr', 'world:review_pr', 'world:merge_pr', 'world:list_prs', 'world:close_pr', 'world:get_pr', 'world:verdicts']
    persist_workdir: true
    secrets: [OPENAI_API_KEY]
    env:                                    # git memory caps for agent clones (git -c via env)
      GIT_CONFIG_COUNT: '3'
      GIT_CONFIG_KEY_0: pack.windowMemory
      GIT_CONFIG_VALUE_0: 256m
      GIT_CONFIG_KEY_1: pack.threads
      GIT_CONFIG_VALUE_1: '1'
      GIT_CONFIG_KEY_2: gc.auto
      GIT_CONFIG_VALUE_2: '0'
    max_turns: 150
    turn_timeout: 2h
    worker_lifetime: 54h
    lifetime_jitter: 0s
    resume_prompt: 'Your previous turn was interrupted. Read your notes, check your clone and PRs, and continue.'
    loop:
      prompt_file: prompts/round.md
      every: turn_end
      notices: true
      on: [comms.mention, comms.thread, comms.dm, comms.channel]
      while: {until: '${LOOP_UNTIL:-48h}', max_rounds: '${LOOP_MAX_ROUNDS:-10000}'}  # smoke: LOOP_UNTIL=30m LOOP_MAX_ROUNDS=100
      final: {prompt_file: prompts/final.md}
  worker:
    <<: *agent
    replicas_ramp: null                     # not ramped
    system_prompt_append_file: prompts/worker.md
    workers: {initial: 0, max_extra: 17}    # 200 workers at 12 per worker, opened on demand
  interviewer:                              # spawned by coordinators and workers; one session each
    harness: llm
    model: interviewer
    name_prefix: iv-                        # iv-teal-heron: interviewers stay recognizable
    replicas: 0
    ephemeral: true                         # removed once its session ends (docs/spawn.md)
    agents_per_worker: 25
    workers: {initial: 0, max_extra: 1}     # 25 live interviewers (run_bot has 26 run slots)
    system_prompt_file: prompts/interviewer.md
    tools: ['world:run_bot', 'world:record_verdict', 'comms:join_channel', 'comms:post', 'comms:read', 'comms:dm']
    bash: false
    tool_choice: required
    max_turns: 24                           # 8-15 run_bot turns + verdict + join + post + dm + done
    tool_output_chars: 8000                 # run_bot returns every reply of the transcript
# depth 2: a coordinator's workers are born with depth 1, so they may spawn interviewers;
# interviewers have no spawn entry (depth 0).
spawn:
  coordinator: {types: {worker: 4, interviewer: 2}, depth: 2}
  worker: {types: {interviewer: 2}, depth: 1}
# 50 coordinators + 200 workers + up to 25 live interviewers. spawned_total never frees a
# place: ~400 for teams, ~7,200 interviewers over 48 h (about 150 an hour).
limits: {alive: 275, spawned_total: 10000}
