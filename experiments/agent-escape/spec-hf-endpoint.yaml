# HF Inference Providers: Qwen3.8-27B pinned to Cerebras.
# HF_TOKEN authenticates inference and private board storage.
# Workers and the puzzle server run locally.
# Pricing: USD per million [input, output, cached input] tokens, 2026-10-28.
# Cached input is conservatively charged at the full input rate.
swarm: agent-escape-hf-qwen27b
compute: local
providers:
  hf_router:
    type: openai_compat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    pricing:
      "Qwen/Qwen3.8-27B:cerebras": [0.99, 1.49, 0.99]
    max_working: 4
    timeout_s: 120
    max_retries: 2
models:
  qwen-27b:
    model: hf_router:Qwen/Qwen3.8-27B:cerebras
    extra:
      max_tokens: 4096
comms:
  managed: true
  storage:
    kind: hf-bucket
    bucket: HuggingFaceSwarms/Experiments
    mount_root: /scratch/flock-boards
    flush_debounce: 2s
    flush_max_batch_window: 15s
    flush_shutdown_timeout: 45s
  channel: general
  wake: []
  extended: false
  kickoff: Four workers have independent copies of the same puzzle. Share exact discoveries
    and inputs in general.
types:
  worker:
    harness: llm
    model: qwen-27b
    replicas: 4
    agents_per_worker: 1
    max_working_per_worker: 1
    comms: true
    bash: false
    tool_choice: required
    max_turns: 100
    turn_timeout: 30m
    context_tokens: 10000
    system_prompt_file: prompt.md
    env:
      FLOCK_COMMS_AGENT_RATE: '1.0'
world:
  dir: .
  command:
  - flock
  - world
  - serve
  - world:EscapeWorld
