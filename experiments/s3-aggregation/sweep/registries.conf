# podman's registries for the sweep's workers (CONTAINERS_REGISTRIES_CONF in their profile):
# Docker Hub images through Google's pull-through mirror first, since each worker job pulls the
# task image into its own storage and the cluster's shared address meets Docker Hub's
# unauthenticated pull limit (toomanyrequests). Docker Hub stays the fallback.
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "mirror.gcr.io"
