# The world's knobs (worlds/chatbot3), read from $CHATBOT_CONFIG (the job's bootstrap points it
# here) and re-read when this file changes (edit it in <bucket>/experiment/, upload
# control/update). Every knob is re-read at the next call, `runs.parallel` included.
probes:
  per_agent_per_hour: 4      # add_probe calls one agent may make per rolling hour
  max_lines: 12              # user lines per probe
  max_total: 400             # swarm probes kept (add_probe refuses beyond)
  gate_sample: 60            # each promotion is decided on the seed probes + a sample of 60
                             # verified live probes (seeded by the candidate's hash; 0: all)
  gate_full_every: 10        # every 10th promotion is decided on the full set (0: never)
interviews:
  start_minutes: 5           # a booking with no chat by then is released (records only)
  expire_minutes: 20         # an interview idle this long is released (records only)
runs:
  parallel: 0                # bot runs at once across the world (run_bot, probes, promotions,
                             # interviews; one promotion may use all of them); 0: the CPUs
  call_deadline_s: 55        # run_bot, qualify, best_status, probes give up after this long
                             # (under the 60 s tool timeout) and drop their queued bot runs;
                             # 0: never. A caller that disconnects drops them too.
  background: 2              # bot runs at once for best's background full-set score (taken
                             # only from slots no other call waits for)
promote:
  max_waiting: 0             # promotions in flight (running + queued) before "busy"; 0: any
  wait_s: 40                 # a promotion still running after 40 s answers `queued` + a
                             # ticket (best_status: `pending`, your result), under the 60 s
                             # tool timeout
