# GENERATED by render.py --variant smoke from spec.yaml (+ waves.yaml for the worker
# slots). Do not edit: change spec.yaml or the environment and render again.
swarm: run3
compute: local
naming: words
tools_dir: tools
providers:
  vllm:
    type: openai_compat
    base_url: https://your-vllm.example.invalid/v1
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing:
      '*':
      - 0
      - 0
      - 0
models:
  worker:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 32000
      temperature: 0.6
      chat_template_kwargs:
        thinking: false
  worker-think:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 32000
      temperature: 0.6
      chat_template_kwargs:
        thinking: true
  interviewer:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 2048
      temperature: 0.7
      chat_template_kwargs:
        thinking: false
world:
  dir: ../../worlds/chatbot3
  command:
  - '{python}'
  - chatbot3.py
  - serve
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  url: https://msgboard.example.invalid
  invite_env: CHATBOT_BOARD_INVITE
  channel: your-run3-channel
  kickoff_file: prompts/kickoff.md
  rules:
    min_post_gap: 10s
    max_len: 800
    threads: per_topic
    no_group_mentions: true
  protocols:
  - protocols/run3.md
  - protocols/chatbot.md
types:
  agent:
    harness: llm
    model: worker
    replicas: 0
    agents_per_worker: 25
    system_prompt_file: prompts/system.md
    comms: true
    tools: &id001
    - spawn_interviewer
    - world:read_file
    - world:grep_file
    - world:write_file
    - world:copy_file
    - world:edit_file
    - world:insert_after
    - world:list_files
    - world:run_bot
    - world:promote_best
    - world:best_status
    - world:qualify
    - world:add_probe
    - world:probes
    - world:book_interview
    - world:verdicts
    bash: false
    tool_choice: required
    max_turns: 20
    tool_output_chars: 32000
    context_tokens: 64000
    loop:
      first: 'You just joined a running effort (round 0). Others have been building for a while. ONE tool
        call per reply:

        1. `search` the channel for what is going on: the threads ("[" tags), "PROMOTED", "INTERVIEW",
        "RED". Then `best_status` for the current best.

        2. Pick ONE: an approach that needs hands (join its thread, `post` "taking: <the piece>") or a
        new angle nobody covers (open a thread: thread "new", "[<tag>] <the idea>: agents/<your name>/...").

        3. If best exists and you have no bot yet: copy_file("best/bot", "agents/<your name>/bot") (or
        best/bot.py), then run_bot it with 6 lines that test your piece.

        4. `done` with "joined: <thread> <your plan>".

        When you add a probe, paste the bot''s failing reply exactly as `run_bot` returned it.

        One thread per approach, not per agent: reply inside the thread of the approach you are extending;
        open a new thread only for a genuinely new approach.

        When you copy or build on someone''s bot, say so in their thread in one line (what you changed).

        Communicate in simple, clear language: short sentences, say what you did and what you need next,
        no jargon or filler.

        '
      prompt_file: prompts/round.md
      every: turn_end
      stagger: 2s
      'on': &id002
      - comms.mention
      - comms.thread
      wake: &id003
        min_gap: 10s
        max: 20
        window: 30m
      while:
        until: 30m
        max_rounds: 120
      final: &id004
        prompt_file: prompts/final.md
  agent-think:
    harness: llm
    model: worker-think
    replicas: 0
    agents_per_worker: 25
    system_prompt_file: prompts/system.md
    comms: true
    tools: *id001
    bash: false
    tool_choice: required
    max_turns: 20
    tool_output_chars: 32000
    context_tokens: 64000
    loop:
      first: 'You just joined a running effort (round 0). Others have been building for a while. ONE tool
        call per reply:

        1. `search` the channel for what is going on: the threads ("[" tags), "PROMOTED", "INTERVIEW",
        "RED". Then `best_status` for the current best.

        2. Pick ONE: an approach that needs hands (join its thread, `post` "taking: <the piece>") or a
        new angle nobody covers (open a thread: thread "new", "[<tag>] <the idea>: agents/<your name>/...").

        3. If best exists and you have no bot yet: copy_file("best/bot", "agents/<your name>/bot") (or
        best/bot.py), then run_bot it with 6 lines that test your piece.

        4. `done` with "joined: <thread> <your plan>".

        When you add a probe, paste the bot''s failing reply exactly as `run_bot` returned it.

        One thread per approach, not per agent: reply inside the thread of the approach you are extending;
        open a new thread only for a genuinely new approach.

        When you copy or build on someone''s bot, say so in their thread in one line (what you changed).

        Communicate in simple, clear language: short sentences, say what you did and what you need next,
        no jargon or filler.

        '
      prompt_file: prompts/round.md
      every: turn_end
      stagger: 2s
      'on': *id002
      wake: *id003
      while:
        until: 30m
        max_rounds: 120
      final: *id004
  interviewer:
    harness: llm
    model: interviewer
    name_prefix: iv-
    replicas: 0
    agents_per_worker: 25
    workers:
      initial: 0
      max_extra: 40
    ephemeral: true
    system_prompt_file: prompts/interviewer.md
    tools:
    - world:chat
    - world:submit_verdict
    - comms:post
    bash: false
    tool_choice: required
    max_turns: 12
    tool_output_chars: 4000
spawn:
  agent: &id005
    types:
    - interviewer
    max: 1
    depth: 1
  agent-think: *id005
limits:
  budget_usd: null
  alive: 2000
