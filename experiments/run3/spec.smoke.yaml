      notices: true
      while:
        until: 30m
        max_rounds: 120
      final: *id004
  interviewer:
    harness: llm
    model: interviewer
    name_prefix: iv-
    replicas: 0
    agents_per_worker: 25
    workers:
      initial: 0
      max_extra: 40
    ephemeral: true
    system_prompt_file: prompts/interviewer.md
    tools:
    - world:chat
    - world:submit_verdict
    - comms:post
    bash: false
    tool_choice: required
    max_turns: 12
    tool_output_chars: 4000
spawn:
  agent: &id005
    types:
    - interviewer
    max: 1
    depth: 1
  agent-think: *id005
  agent-pi: *id005
limits:
  budget_usd: null
  alive: 2000
