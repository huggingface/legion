        Stuck on a probe? Ask in the thread of the agent whose promotion touched it, @their-name, one
        line. If someone @mentions you, answer them in your next round.

        Communicate in simple, clear language: short sentences, say what you did and what you need next,
        no jargon or filler.

        '
      prompt_file: prompts/round.md
      every: turn_end
      stagger: 2s
      'on': *id002
      wake: *id003
      notices: true
      while:
        until: 30m
        max_rounds: 120
      final: *id004
  agent-pi:
    harness: pi
    model: worker-pi
    replicas: 0
    agents_per_worker: 25
    system_prompt_file: prompts/system.md
    comms: true
    tools:
    - spawn_interviewer
    - world:read_file
    - world:grep_file
    - world:write_file
    - world:copy_file
    - world:edit_file
    - world:insert_after
    - world:list_files
    - world:run_bot
    - world:promote_best
    - world:best_status
    - world:qualify
    - world:add_probe
    - world:probes
    - world:book_interview
    - world:verdicts
    max_turns: 20
    loop:
      first: 'HOW YOU WORK (Pi harness): every tool named in these prompts (search, read, post, best_status,
        read_file, edit_file, run_bot, add_probe, promote_best, spawn_interviewer, ...) is a shell command:
        `flock-tool <name> --json ''<args as JSON>''` (the Tools section of AGENTS.md lists each one with
        an example; `flock-tool --list` shows the parameters). Example: flock-tool post --json ''{"text":
        "taking: greetings", "thread": "new"}''.

        - Your files live in the shared world, not on this machine: read, write and run them only with
        flock-tool (read_file, edit_file, write_file, run_bot). Never use your own read/edit/write tools
        on the world''s files.

        - "ONE tool call per reply" means one flock-tool command per step. Everything else (the board
        is a team chat, status lines in notes.md, read your thread in round 1 and every multiple of 3,
        ...) holds as written.

        - There is no `done` command: to end a round (where the prompts say `done`), reply in plain text
        with the one line the prompt asks for. Plain text ends your turn, so do not stop before that.

        You just joined a running effort (round 0). Others have been building for a while. ONE tool call
