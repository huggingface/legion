# GENERATED by render.py --variant smoke from spec.yaml (+ waves.yaml for the worker
# slots). Do not edit: change spec.yaml or the environment and render again.
swarm: run3
compute: local
naming: words
tools_dir: tools
providers:
  vllm:
    type: openai_compat
    base_url: https://your-vllm.example.invalid/v1
    api_key_env: OPENAI_API_KEY
    self_hosted: true
    timeout_s: 300
    max_retries: 5
    pricing:
      '*':
      - 0
      - 0
      - 0
models:
  worker:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 32000
      temperature: 0.6
      chat_template_kwargs:
        thinking: false
  worker-think:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 32000
      temperature: 0.6
      chat_template_kwargs:
        thinking: true
  worker-pi:
    model: vllm:MODEL_WORKER
    reasoning: high
  interviewer:
    model: vllm:MODEL_WORKER
    extra:
      max_tokens: 2048
      temperature: 0.7
      chat_template_kwargs:
        thinking: false
world:
  dir: ../../worlds/chatbot3
  command:
  - '{python}'
  - chatbot3.py
  - serve
  token_env: CHATBOT_WORLD_TOKEN
comms:
  kind: msgboard
  url: https://msgboard.example.invalid
  invite_env: CHATBOT_BOARD_INVITE
  channel: your-run3-channel
  kickoff_file: prompts/kickoff.md
  rules:
    min_post_gap: 10s
    max_len: 800
    threads: per_topic
    no_group_mentions: true
  protocols:
  - protocols/run3.md
  - protocols/chatbot.md
types:
  agent:
    harness: llm
    model: worker
    replicas: 0
    agents_per_worker: 25
    system_prompt_file: prompts/system.md
    comms: true
    tools: &id001
    - spawn_interviewer
    - world:read_file
    - world:grep_file
    - world:write_file
    - world:copy_file
    - world:edit_file
    - world:insert_after
    - world:list_files
    - world:run_bot
    - world:promote_best
    - world:best_status
    - world:qualify
    - world:add_probe
    - world:probes
    - world:book_interview
    - world:verdicts
    bash: false
    tool_choice: required
    max_turns: 20
    tool_output_chars: 32000
    context_tokens: 64000
    loop:
      first: 'You just joined a running effort (round 0). Others have been building for a while. ONE tool
        call per reply:

        1. `search` the channel for what is going on: the threads ("[" tags), "promoted", "INTERVIEW".
        Then `best_status` for the current best.

        2. Pick ONE: an approach that needs hands (join its thread, `post` "taking: <the piece>") or a
        new angle nobody covers (open a thread: thread "new", "[<tag>] <the idea>: agents/<your name>/...").

        3. If best exists and you have no bot yet: copy_file("best/bot", "agents/<your name>/bot") (or
        best/bot.py), then run_bot it with 6 lines that test your piece.

        4. `done` with "joined: <thread> <your plan>".

        In the rounds after this one: Round 1 and every round that is a multiple of 3 (3, 6, 9, ...):
        first call `read` your own thread (n: 10); if another agent posted there, answer them in one line
        there before your own work. Other rounds: skip that read, unless you were @mentioned: then read
        and answer them first. If you cannot find your thread, `search` your [tag].

        Probes: each agent can add only 2 probes an hour. Add a probe only for a failure a real user would
        notice and that best fails now (run_bot best first), not a variant of an existing probe (grep_file
        probes/ first). One clear check per probe; paste the bot''s failing reply exactly as `run_bot`
        returned it.

        The probe set is a growing collection of tests written during the project: a guide to evaluate
        your bot, not a target. To check a change, use qualify (it scores a 60-probe sample) or run_bot
        on the few probes that matter for it; never try to run all the probes.

        Status lines (GREEN, RED, the PROBE line from add_probe) go in your notes, never on the board:
        insert_after("agents/<your name>/notes.md", "# notes", "<line>"); no file yet? write_file it once
        with "# notes" and the line.

        The board is a team chat. Do not post status reports to the board; it is a chat, not a log. Write
        short messages TO someone, by name: a question, an answer, "I''m taking [tag], anyone already
        on it?". Post in your approach''s thread; a new root only for a genuinely new approach, titled
        [tag] what it is. Reply to people who talk to you.

        When you `copy_file` another agent''s best or module, post one line in THEIR thread: what you
        took and what you changed.

        Stuck on a probe? Ask in the thread of the agent whose promotion touched it, @their-name, one
        line. If someone @mentions you, answer them in your next round.

        Communicate in simple, clear language: short sentences, say what you did and what you need next,
        no jargon or filler.

        '
      prompt_file: prompts/round.md
      every: turn_end
      stagger: 2s
      'on': &id002
      - comms.mention
      - comms.thread
      wake: &id003
        min_gap: 10s
        max: 20
        window: 30m
      notices: true
      while:
        until: 30m
        max_rounds: 120
      final: &id004
        prompt_file: prompts/final.md
  agent-think:
    harness: llm
    model: worker-think
    replicas: 0
    agents_per_worker: 25
    system_prompt_file: prompts/system.md
    comms: true
    tools: *id001
    bash: false
    tool_choice: required
    max_turns: 20
    tool_output_chars: 32000
    context_tokens: 64000
    loop:
      first: 'You just joined a running effort (round 0). Others have been building for a while. ONE tool
