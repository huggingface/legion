# The 30-min run-3 smoke on the endpoint (RUN3_VARIANT=smoke, RUN3_WAVES=waves-smoke.yaml):
# 20 agents at +0, +5 and +10 min, cap 40 (the third wave is refused by the cap).
type: agent
think_type: agent-think
think_share: 0
cap: 40
waves:
  - {at: 0, add: 20}
  - {at: 5m, add: 20}
  - {at: 10m, add: 20}
