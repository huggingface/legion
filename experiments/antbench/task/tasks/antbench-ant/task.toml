schema_version = "1.4"

[task]
name = "HuggingFaceSwarms/antbench-ant"
version = "0.1.0"

[metadata]
description = "Control one ant of a team that carries a load through two gates, through a shared world's tools."
tags = ["multi-agent", "real-time", "coordination"]

[agent]
timeout_sec = 1800

[environment]
# Prebuilt, public image: the agent needs only Python 3.10+ for legion's world tools. Harbor
# installs curl and Pi (Node through nvm) at start.
docker_image = "python:3.12-slim"
cpus = 1
memory_mb = 1024

[verifier]
timeout_sec = 60
