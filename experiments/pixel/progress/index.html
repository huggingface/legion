<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flock pixel runs</title>
<style>
  :root { --bg:#f7f7f4; --card:#fff; --fg:#1c1c1a; --muted:#6a6a64; --line:#e3e2dc;
          --a:#2f6fd6; --b:#d9822b; --ok:#2f8f46; --bad:#c4462c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1d1d1b; --fg:#ecebe6; --muted:#9a9993; --line:#2e2e2b;
            --a:#6b9cf0; --b:#f0a35a; --ok:#5cc177; --bad:#e8775f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px;
           border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  h2 { font-size:13px; margin:0 0 8px; color:var(--muted); font-weight:600; }
  select, button, input { font:inherit; color:var(--fg); background:var(--card);
           border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .pill { padding:2px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; }
  .pill.running { color:var(--ok); border-color:var(--ok); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  .wide { grid-column: 1 / -1; }
  .imgs { display:flex; gap:8px; }
  .imgs figure { margin:0; flex:1; min-width:0; }
  .imgs img, .imgs canvas { width:100%; display:block; image-rendering:pixelated; background:#000; border-radius:4px; }
  figcaption, .muted { color:var(--muted); font-size:12px; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
  .tile { border:1px solid var(--line); border-radius:6px; padding:8px; }
  .tile .v { font-size:20px; font-variant-numeric: tabular-nums; }
  .tile .k { color:var(--muted); font-size:12px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric: tabular-nums; font-size:12px; }
  td, th { text-align:right; padding:3px 6px; border-bottom:1px solid var(--line); }
  td:first-child, th:first-child { text-align:left; }
  canvas.chart { width:100%; height:180px; display:block; }
  .legend span { margin-right:12px; font-size:12px; }
  .legend i { display:inline-block; width:10px; height:3px; vertical-align:middle; margin-right:4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .row input[type=range] { flex:1; min-width:180px; }
  a { color:var(--a); }
  .links a { margin-right:12px; }
  .empty { padding:48px 16px; text-align:center; color:var(--muted); }
  .err { color:var(--bad); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>flock pixel runs</h1>
  <select id="run" aria-label="run"></select>
  <span id="pill" class="pill">-</span>
  <span id="when" class="muted"></span>
</header>
<div id="empty" class="empty" hidden>No run yet. The driver adds runs here (see experiments/pixel/progress/README.md).</div>
<main id="main" hidden>
  <section id="live">
    <h2>Canvas</h2>
    <div class="imgs">
      <figure><img id="liveimg" alt="live canvas"><figcaption id="livecap">live, every 10 s</figcaption></figure>
      <figure><img id="targetimg" alt="target"><figcaption>target</figcaption></figure>
    </div>
    <p id="liveerr" class="err"></p>
  </section>
  <section>
    <h2>Score</h2>
    <div class="tiles" id="tiles"></div>
    <h2 style="margin-top:12px">Top agents (useful pixels)</h2>
    <table id="agents"><thead><tr><th>agent</th><th>useful</th><th>dup</th><th>wrong</th><th>overwr.</th><th>calls</th></tr></thead><tbody></tbody></table>
  </section>
  <section class="wide">
    <h2>Progress over time</h2>
    <div class="legend"><span><i style="background:var(--a)"></i>done % (work set)</span><span><i style="background:var(--b)"></i>exact match %</span></div>
    <canvas id="chart" class="chart"></canvas>
    <div class="legend"><span><i style="background:var(--a)"></i>canvas req/s</span><span><i style="background:var(--b)"></i>agents working</span></div>
    <canvas id="chart2" class="chart" style="height:120px"></canvas>
    <p class="muted" id="flock"></p>
  </section>
  <section class="wide" id="replaysec" hidden>
    <h2>Replay (from the uploaded paint log)</h2>
    <div class="imgs">
      <figure><canvas id="replay" width="1024" height="1024"></canvas><figcaption id="replaycap">loading...</figcaption></figure>
      <figure><img id="finalimg" alt="final canvas"><figcaption>final canvas</figcaption></figure>
    </div>
    <div class="row">
      <button id="play">Play</button>
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="log position">
      <select id="speed" aria-label="speed"><option value="10">10/tick</option><option value="100" selected>100/tick</option><option value="1000">1000/tick</option></select>
    </div>
    <p class="muted" id="entry"></p>
  </section>
  <section class="wide links" id="links"></section>
</main>
<script src="app.js"></script>
</body>
</html>
