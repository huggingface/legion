# Experiment 2: 10 Sonnet 5.5 leaders, each spawning 100 LFM2.5-2.6B painters, coordinating via
# canvas region leases (REGION_ENFORCE=1, job-spawn.sh). Painter types, providers and settings are
# EXACTLY spec-1k.yaml's (3 types x 3 GPUs, 25 agents per worker, 10 px/call, done_tool true,
# max_turns 25, context_tokens 3000), except replicas 0: every painter is a leader's child
# (`<leader>-<type>-<NNNN>`). Leaders: run/leader.md. Spawn caps 34/33/33 per leader.
# workers {initial: 14, max_extra: 2} per painter type are slots, not pre-started workers: the
# first child placed on a new worker waits for its boot (~30-45 s, docs/spawn.md "Not yet").
# Controller: the `pixel-run` wheel (spawn is on main; llm harness + bulk prompts on top).
# Fill <JOB_ID_1..3> from job-spawn.sh output.
swarm: pixel-spawn
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock/pixel-spawn
providers:
  gpu1:
    type: openai_compat
    base_url: "https://<JOB_ID_1>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
  gpu2:
    type: openai_compat
    base_url: "https://<JOB_ID_2>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
  gpu3:
    type: openai_compat
    base_url: "https://<JOB_ID_3>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
models:
  lfm1:
    model: "gpu1:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
  lfm2:
    model: "gpu2:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
  lfm3:
    model: "gpu3:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
types:
  leader:
    harness: pi
    model: anthropic/claude-sonnet-5-5   # one of Pi's built-in providers
    system_prompt_file: leader.md
    # BOARD_URL / BOARD_INVITE: the msgboard (one multi-use agent invite scoped to
    # #flock-pixel-test; each leader joins under its flock name). Painters get none of this.
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN, CANVAS_URL, CANVAS_TOKEN, BOARD_URL, BOARD_INVITE]
    # SWARM: leader.md lists children with `flock agents $SWARM --parent ...`;
    # BOARD_CHANNEL_NAME: board.py finds the channel id by name after joining.
    env: {SWARM: pixel-spawn, BOARD_CHANNEL_NAME: flock-pixel-test}
    replicas: 10
    agents_per_worker: 5         # 2 cpu-basic workers
    workers: {initial: 2, max_extra: 0}
    flavor: cpu-basic
    max_turns: 200               # one "go" prompt runs the whole job: lease, spawn, grant, watch
    max_budget_usd: 1.0          # per prompt (Sonnet); the shell loops keep it far below
    turn_timeout: 60m
    labels: {experiment: pixel-spawn}
  painter-a:
    harness: llm
    model: lfm1                 # painter-a -> gpu1 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 0                  # spawned by the leaders only
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 334; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-spawn}
  painter-b:
    harness: llm
    model: lfm2                 # painter-b -> gpu2 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 0                  # spawned by the leaders only
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 333; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-spawn}
  painter-c:
    harness: llm
    model: lfm3                 # painter-c -> gpu3 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 0                  # spawned by the leaders only
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 333; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-spawn}
spawn:
  leader: {types: {painter-a: 34, painter-b: 33, painter-c: 33}, depth: 1}
limits: {alive: 1100, spawned_total: 1500}   # spawned_total is lifetime: 500 replacements
