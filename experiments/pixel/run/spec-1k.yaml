# Pixel 1k run: 1,000 LFM2.5-2.6B painters. IDENTICAL to run 1 (spec-100.yaml) except agent
# count, GPUs and workers (Carlos): same model + extra, tool_choice required, done_tool true,
# max_turns 25, context_tokens 3000, turn_timeout 6m, painter.md, 25 agents per cpu-basic worker;
# canvas defaults unchanged (MAX_PIXELS_PER_CALL=10, scattered claims, white blank).
# Only: 3 painter types x 3 providers (one rtx-pro-6000 job each, job-1k.sh), ~40 workers.
# Controller: the `pixel-run` wheel (main + PR #7 llm harness + prompt-type bulk route).
# Fill <JOB_ID_1..3> from job-1k.sh output (`hf jobs inspect --json` -> status.expose_urls).
swarm: pixel-1k
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock/pixel-1k
providers:
  gpu1:
    type: openai_compat
    base_url: "https://<JOB_ID_1>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
  gpu2:
    type: openai_compat
    base_url: "https://<JOB_ID_2>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
  gpu3:
    type: openai_compat
    base_url: "https://<JOB_ID_3>--8000.hf.jobs/v1"   # FILL IN: job-1k.sh prints it
    api_key_env: HF_TOKEN        # what the jobs proxy checks; vLLM itself has no key
    self_hosted: true
    max_working: 400             # >= replicas per type. At 128 (1k run 2026-10-19) only 128 agents per
                                 # provider ever ran: admission holds a slot until the agent's next
                                 # heartbeat and the first workers to poll keep re-taking freed slots, so
                                 # 205 agents per type sat at 0 turns. vLLM still had max-num-seqs 512.
    timeout_s: 60
    max_retries: 4
models:
  lfm1:
    model: "gpu1:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
  lfm2:
    model: "gpu2:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
  lfm3:
    model: "gpu3:LiquidAI/LFM2.5-2.6B"
    extra:
      max_tokens: 256
      chat_template_kwargs: {enable_thinking: false}
types:
  painter-a:
    harness: llm
    model: lfm1                 # painter-a -> gpu1 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 334
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 334; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-1k}
  painter-b:
    harness: llm
    model: lfm2                 # painter-b -> gpu2 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 333
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 333; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-1k}
  painter-c:
    harness: llm
    model: lfm3                 # painter-c -> gpu3 (flock has no client-side balancing)
    tool_choice: required
    done_tool: true
    max_turns: 25
    max_budget_usd: 0.05
    context_tokens: 3000
    turn_timeout: 6m
    replicas: 333
    agents_per_worker: 25        # run 1: 25 per cpu-basic (50 was CPU-bound)
    max_working_per_worker: 25
    workers: {initial: 14, max_extra: 2}   # 14 x 25 = 350 >= 333; ~40 workers in total
    flavor: cpu-basic
    secrets: [CANVAS_URL, CANVAS_TOKEN]
    system_prompt_file: painter.md
    labels: {experiment: pixel-1k}
