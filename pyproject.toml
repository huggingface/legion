[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flock"
version = "0.1.0"
description = "Parallel Harbor agents collaborating through a dedicated message board"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.25.0",
  "podman-compose==1.5.0",
  "msgboard[hf] @ git+https://github.com/huggingface/msgboard.git@639fdd5cb9ec6a93f44a3b0139611549caf56b8b",
  "pydantic>=2.12",
  "PyYAML>=6.0.2",
  "exceptiongroup>=1.3", # board bundle also supports Python 3.10 task images
  "packaging>=24",
]

[project.scripts]
flock-tool = "flock.tools.runner:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/flock"]

[tool.hatch.build.targets.sdist]
include = ["/src/flock/**", "/scripts/**", "/tools/*.py", "/tools/README.md", "/resources/*.py", "/prompts/*.md", "/tests/**", "/examples/pi-*.yaml", "/launch.slurm", "/docs/**", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
