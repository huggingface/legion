[project]
name = "flock"
version = "0.0.1"
description = "Host coding-harness agent swarms on Hugging Face Jobs: keep them alive, prompt them, watch them."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "typer>=0.12",
  "huggingface_hub>=1.0",
]

[project.optional-dependencies]
controller = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
worker = ["claude-agent-sdk>=0.1"]
# Shepherd's Harbor task path (src/flock/harbor); pins as on shepherd f3970bc. Harbor needs Python 3.12+.
harbor = [
  "harbor==0.25.0; python_version >= '3.12'",
  "podman-compose==1.5.0; python_version >= '3.12'",
  "msgboard @ git+https://github.com/huggingface/msgboard.git@5234ffd70b388ba9b64daa1dc8275a03230814f9",
  "packaging>=24",
  "exceptiongroup>=1.3",  # board bundle also supports Python 3.10 task images
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "respx>=0.21"]

[project.scripts]
flock = "flock.cli:app"
flock-agent = "flock.cli:agent_app"
flock-controller = "flock.controller.main:main"
flock-worker = "flock.worker.main:main"
flock-tool = "flock.tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# harbor's litellm needs huggingface-hub<2. Declaring the extra in conflict with a group nobody
# installs forks the lock on it, so installs without the extra keep flock's own pins.
[dependency-groups]
no-harbor = []

[tool.uv]
conflicts = [[{ extra = "harbor" }, { group = "no-harbor" }]]

[tool.hatch.metadata]
allow-direct-references = true  # msgboard is pinned to a git commit

[tool.hatch.build.targets.wheel]
packages = ["src/flock"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/slurm" = "flock/slurm"  # `flock init` copies them into a slurm run directory

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# ruff >= 0.17 enables PYI041 by default; models.py is the shared contract, left as written.
"src/flock/models.py" = ["PYI041"]
# Copied from shepherd f3970bc, whose ruff selects only E4/E7/E9/F/I; left as written.
"src/flock/harbor/**" = ["BLE001", "PLR1704", "SIM117", "TRY004", "UP017"]
"tests/harbor/**" = ["C401", "PLW1510", "RUF012", "SIM117"]
