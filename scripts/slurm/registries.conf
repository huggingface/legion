# podman's registries for harbor workers (worker.sbatch) and podman-node.sh: the default
# CONTAINERS_REGISTRIES_CONF there; a cluster profile's own value wins. Docker Hub images come
# through Google's pull-through mirror first, since each worker job pulls the task's base image
# into its own storage and a cluster's shared address meets Docker Hub's unauthenticated pull
# limit (toomanyrequests). Docker Hub stays the fallback.
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "mirror.gcr.io"
