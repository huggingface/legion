# Tools folder demo (docs/tools.md): two `llm` agents with function tools from ./tools.
# `flock launch examples/tools-demo/spec.yaml` packs ./tools, uploads it, and the agents get
# ws_write and run_bot next to bash. Edit tools/workspace.py and apply again: running agents use
# the new version from their next turn.
swarm: tools-demo
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock
# tools_dir: tools                # the default: tools/ next to this file
providers:
  hf:
    type: openai_compat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    pricing: {"*": [0.3, 1.2, 0.3]}   # placeholder: put your model's price (USD per 1M tokens)
types:
  dev:
    harness: llm
    model: "hf:deepseek-ai/DeepSeek-V3.2"
    replicas: 2
    tools: [ws_write, run_bot]      # or `all`; an unknown name fails `flock launch`
    tool_choice: required           # every model call is a tool call; `done` ends the turn
    max_turns: 14
    max_budget_usd: 0.5
    system_prompt: |
      Write a small rule-based chatbot in ws/bot.py with ws_write, test it with run_bot on a few
      messages, fix what fails, then call done with one line on what the bot can do.
