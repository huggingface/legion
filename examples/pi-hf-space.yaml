name: pi-hf-space-team
harness: pi
model: huggingface/moonshotai/Kimi-K2.5
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_TOKEN
  api_format: openai_chat_completions
task:
  repo: https://huggingface.co/datasets/harborframework/terminal-bench-2.1
  dataset: terminal-bench-2.1@2.1.0
  selector: regex-log
  revision: 3e235dff6880252a587fa479c09bcb1e16edf2eb
team_file: ../prompts/team.md
resources_dir: ../resources
resources:
  message_board:
    channels: [general]
    # A Space in your account; relaunching with the same ID joins the same board.
    space_id: pi-hf-space-board
    private: true
tools_dir: ../tools
tools:
  - message_board.*  # All tools exported by tools/message_board.py
agents:
  count: 2
environment:
  backend: docker
limits:
  run_timeout_seconds: 900
  agent_max_turns: 30
output_dir: ../results
