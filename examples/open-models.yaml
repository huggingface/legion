# Open models through the `providers:` block (docs/open-models.md).
swarm: open-models
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock
providers:                       # where models are served
  hf:   {type: openai_compat, base_url: https://router.huggingface.co/v1, api_key_env: HF_TOKEN,
         pricing: {"Qwen/Qwen3.8-27B:deepinfra": [0.2, 2.5, 0.2]}}  # router /v1/models, 2026-10-16
  gpu1: {type: openai_compat, base_url: "https://qwen.example.org/v1",  # your vLLM, over HTTPS
         api_key_env: VLLM_API_KEY,
         self_hosted: true, max_working: 256,
         pricing: {"Qwen/Qwen3.8-27B-FP8": [0, 0, 0]}}
models:                          # optional aliases and per-model settings
  qwen-27b: {model: "gpu1:Qwen/Qwen3.8-27B-FP8", reasoning: medium,
             extra: {chat_template_kwargs: {enable_thinking: false}}}
types:
  # The router provider is pinned (":deepinfra"): its automatic choice failed every turn after a
  # tool call on 2026-10-16. gpu1 is a vLLM server the workers reach over HTTPS.
  worker:  {harness: llm, model: "hf:Qwen/Qwen3.8-27B:deepinfra", replicas: 2}  # provider-prefixed
  analyst: {harness: llm, model: qwen-27b, replicas: 2}                # alias into models:
  writer:  {harness: pi, model: anthropic/claude-opus-5-5, replicas: 1,  # harness-native id
            secrets: [ANTHROPIC_API_KEY]}
