# Shared Pi/HF configuration with two explorers and one reviewer.
name: pi-hf-roles
harness: pi
model: huggingface/Qwen/Qwen3.8-27B:cerebras
inference:
  base_url: https://router.huggingface.co/v1
  api_key_env: HF_TOKEN
  api_format: openai_chat_completions
task:
  repo: https://huggingface.co/datasets/harborframework/terminal-bench-2.1
  dataset: terminal-bench-2.1@2.1.0
  selector: regex-log
  revision: 3e235dff6880252a587fa479c09bcb1e16edf2eb
team_file: ../prompts/team.md
resources_dir: ../resources
resources:
  board:
    channels: [general]
tools_dir: ../tools
tools:
  - board.*
agents:
  roles:
    explorer:
      count: 2
      role_file: ../prompts/explorer.md
    reviewer:
      count: 1
      role_file: ../prompts/reviewer.md
environment:
  backend: docker
limits:
  run_timeout_seconds: 600
  agent_max_turns: 30
output_dir: ../results
