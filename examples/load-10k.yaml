# 10k load test (experiments/load-10k/RESULTS.md): 10,000 Claude haiku agents of two types on
# fifty cpu-upgrade workers (8 vCPU, 32 GB), 200 agents per worker: 6,000 scribes on 30 workers
# and 4,000 counters on 20. Same prompts, packing limit and budget caps as examples/load-1k.yaml;
# worker_lifetime 60m + 0-15m jitter so the fifty deadline drains spread over a quarter hour.
swarm: load-10k
namespace: cmpatino
bucket: hf://buckets/cmpatino/swarm-harness/load-10k
types:
  scribe:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/scribe.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: swarm-harness-10k}
    replicas: 6000
    flavor: cpu-upgrade
    agents_per_worker: 200
    max_working_per_worker: 120
    idle_grace: 60s
    worker_lifetime: 60m
    lifetime_jitter: 15m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
  counter:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/counter.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: swarm-harness-10k}
    replicas: 4000
    flavor: cpu-upgrade
    agents_per_worker: 200
    max_working_per_worker: 120
    idle_grace: 60s
    worker_lifetime: 60m
    lifetime_jitter: 15m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
