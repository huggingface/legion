# 5 agents on your laptop (docs/local.md): `flock run examples/local.yaml`.
# On HF Jobs: change `compute: local` to `compute: hf-jobs`; nothing else changes.
swarm: hello
compute: local
namespace: your-hf-name                  # used by hf-jobs only
bucket: hf://buckets/your-hf-name/flock  # used by hf-jobs only
providers:
  local: {type: openai_compat, base_url: "http://localhost:11434/v1", api_key_env: LOCAL_KEY, self_hosted: true}
types:
  writer:
    harness: llm
    model: "local:qwen3:4b"
    replicas: 5
