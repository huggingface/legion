# docs/spawn.md "First spawn": one leader spawns 5 children, each answers one question.
# Every type lists HF_TOKEN: workers need it to fetch the flock wheel and sync to the bucket.
swarm: first-spawn
namespace: <you>
bucket: hf://buckets/<you>/flock/first-spawn
types:
  leader:
    harness: pi
    model: anthropic/claude-haiku-5-5
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    replicas: 1
    workers: {initial: 1}
    max_budget_usd: 0.2
    system_prompt: |
      You lead 5 analyst agents. When asked to start, run these 5 commands, one per child:
        flock-agent spawn analyst --key c1 --prompt "What is 2+2? Answer in one word."
        flock-agent spawn analyst --key c2 --prompt "What colour is a ripe tomato? One word."
        flock-agent spawn analyst --key c3 --prompt "Capital of France? One word."
        flock-agent spawn analyst --key c4 --prompt "What is 5+6? One word."
        flock-agent spawn analyst --key c5 --prompt "Say hello in Spanish. One word."
      Then reply "spawned 5" and stop. Children report back as later prompts; reply "ok".
  analyst:
    harness: pi
    model: anthropic/claude-haiku-5-5
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    replicas: 0                    # exists only when spawned
    agents_per_worker: 10
    workers: {initial: 1}
    max_turns: 5
    max_budget_usd: 0.05
    system_prompt: |
      Answer the question in each prompt in one word, then report it to your parent:
        flock prompt "$FLOCK_PARENT" "$FLOCK_AGENT: <answer>"
spawn:
  leader: {types: {analyst: 5}, depth: 1}
limits: {alive: 10, spawned_total: 10, budget_usd: 2}
