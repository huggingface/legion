# 1k load test (experiments/load-1k/RESULTS.md): 1,000 Claude haiku agents of two types on five
# cpu-upgrade workers (8 vCPU, 32 GB). Placement is per type, so the requested 660/340 split would
# need 4 + 2 = 6 workers at 200 per worker; 600/400 keeps five workers of exactly 200 agents.
# max_working_per_worker comes from
# experiments/packing/RESULTS-cpu-upgrade.md (turn p95 under 30 s at 120 concurrent cold turns).
swarm: load-1k
namespace: cmpatino
bucket: hf://buckets/cmpatino/swarm-harness/load-1k
types:
  scribe:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/scribe.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: swarm-harness-1k}
    replicas: 600
    flavor: cpu-upgrade
    agents_per_worker: 200
    max_working_per_worker: 120
    idle_grace: 60s
    worker_lifetime: 50m
    lifetime_jitter: 10m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
  counter:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/counter.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: swarm-harness-1k}
    replicas: 400
    flavor: cpu-upgrade
    agents_per_worker: 200
    max_working_per_worker: 120
    idle_grace: 60s
    worker_lifetime: 50m
    lifetime_jitter: 10m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
