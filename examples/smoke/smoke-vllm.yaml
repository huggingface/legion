# Smoke runs 2 and 3 (flock-board/smoke-results.md): one vLLM GPU job serving
# Qwen/Qwen3.8-27B-FP8, started with
#   hf jobs run --flavor a100-large --timeout 30m --network-group flock-smoke --network-alias vllm
#     --secrets VLLM_API_KEY vllm/vllm-openai:v0.31.0 ... vllm serve ... --api-key "$VLLM_API_KEY"
# The cpu-basic workers join the same network group (provider network_group) and reach vLLM
# directly; vLLM keeps its API key. Run 2: 4 Codex agents on the Responses API. Run 3: 1 Claude
# Code agent on vLLM's Anthropic Messages endpoint, key sent as a bearer token (auth: bearer).
# (2026-10-16 first attempt used the jobs proxy, --expose-public, and got vLLM's 401: see git log.)
swarm: smoke-vllm
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock/smoke
providers:
  gpu:  {type: openai_compat, base_url: "http://${HF_NETWORK_GROUP_PREFIX}vllm:8000/v1",
         api_key_env: VLLM_API_KEY, self_hosted: true, max_working: 2, network_group: flock-smoke}
  gpua: {type: anthropic, base_url: "http://${HF_NETWORK_GROUP_PREFIX}vllm:8000",
         api_key_env: VLLM_API_KEY, self_hosted: true, network_group: flock-smoke, auth: bearer}
types:
  coder:
    harness: codex
    model: "gpu:Qwen/Qwen3.8-27B-FP8"
    flavor: cpu-upgrade   # cpu-basic is refused: "not available where network group ... runs"
    replicas: 4
    agents_per_worker: 4
    max_working_per_worker: 4
    labels: {experiment: flock-smoke}
    worker_lifetime: 35m
    lifetime_jitter: 1m
    drain_window: 2m
    idle_grace: 60s
    turn_timeout: 10m
  writer:
    harness: claude
    model: "gpua:Qwen/Qwen3.8-27B-FP8"
    flavor: cpu-upgrade
    replicas: 1
    agents_per_worker: 1
    env: {CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8192"}   # keep prompt + output inside --max-model-len
    labels: {experiment: flock-smoke}
    worker_lifetime: 35m
    lifetime_jitter: 1m
    drain_window: 2m
    idle_grace: 60s
    turn_timeout: 10m
    max_turns: 20
