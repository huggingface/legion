# World demo (docs/world.md): two `llm` agents share the task board world in worlds/taskboard.
# `flock launch` starts the world as a child process in `dir` (port and secret chosen by flock),
# checks its manifest, gives each agent the world's tools next to bash, and stops the world
# with the run. The board's state is worlds/taskboard/taskboard.db (delete it to start over).
#
# Offline, with the fake model server the tests use (it calls the tool named in the prompt):
#
#   python tests/fake_openai.py 8199 /tmp/fake-requests.jsonl &
#   FAKE_KEY=unused uv run python -m flock.controller.localrun examples/world-demo/spec.yaml --skip-preflight \
#     --until idle --prompt 'call: claim_task {"name": "greeting"}'
#
# One agent gets the claim; the other reads "'greeting' is claimed by worker-000N" as its tool
# result. The world's log is <run dir>/logs/world-world-demo.log.
#
# For a real model, point `providers` at it (docs/local.md) and give the agents a system prompt
# that says how to use the board. On hf-jobs, run the world yourself (a Job or a Space) and add
# `url:` (and `token_env:`) to the block: `command` is for compute: local.
swarm: world-demo
compute: local
world:
  dir: ../../worlds/taskboard
  command: ["{python}", -m, flock.world, serve, "taskboard:TaskBoard"]
providers:
  fake: {type: openai_compat, base_url: "http://127.0.0.1:8199/v1", api_key_env: FAKE_KEY, self_hosted: true}
types:
  worker:
    harness: llm
    model: fake:fake-model
    replicas: 2
    # every tool of the world; or list some: tools: [world:list_tasks, world:claim_task]
