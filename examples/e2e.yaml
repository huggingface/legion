# Milestone-1 end-to-end test (experiments/e2e/RESULTS.md): 100 Claude agents of two types on
# three cpu-basic workers. Codex is out of scope here (no OpenAI key), so heterogeneity is two
# Claude types with different system prompts.
swarm: e2e
namespace: cmpatino
bucket: hf://buckets/cmpatino/flock/e2e
types:
  scribe:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/scribe.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: flock-m1}
    replicas: 66
    agents_per_worker: 34
    max_working_per_worker: 20
    idle_grace: 60s
    worker_lifetime: 40m
    lifetime_jitter: 5m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
  counter:
    harness: claude
    model: claude-haiku-5-5
    system_prompt_file: prompts/counter.md
    secrets: [ANTHROPIC_API_KEY, HF_TOKEN]
    labels: {experiment: flock-m1}
    replicas: 34
    agents_per_worker: 34
    max_working_per_worker: 20
    idle_grace: 60s
    worker_lifetime: 40m
    lifetime_jitter: 5m
    drain_window: 5m
    max_budget_usd: 0.05
    max_turns: 3
    persist_workdir: true
